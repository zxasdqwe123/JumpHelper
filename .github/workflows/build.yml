name: Build JumpHelper APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Unit Tests & Build Debug APK
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.13
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo '## Build Summary' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '^(e:|w:)' build.log >> $GITHUB_STEP_SUMMARY || echo '(no Kotlin/Gradle errors or warnings)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Prepare APK Artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/JumpHelper-debug.apk
          ls -lh release/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpHelper-debug-${{ github.run_number }}
          path: release/JumpHelper-debug.apk
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "JumpHelper 跳一跳助手 (Build #${{ github.run_number }})"
          body: |
            自动云编译 Debug APK（targetSdk 36 / minSdk 30，纯 Kotlin 无 OpenCV 体积精简）。

            ### 手机直装步骤（Android 13–16 单机免电脑）
            1. 点击下方 `JumpHelper-debug.apk` 下载并安装。
            2. 打开 App，先点 **「1. 打开无障碍设置」** 尝试开启（如提示“受限制的设置”属正常安全机制）。
            3. 再点 **「2. 允许受限设置（应用信息）」** → 右上角 **「⋮」** → **「允许受限设置」** 并验证锁屏。
            4. 返回无障碍设置开启 **JumpHelper 跳一跳助手**，悬浮控制条即自动出现。

            Commit: `${{ github.sha }}`
          files: release/JumpHelper-debug.apk
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
